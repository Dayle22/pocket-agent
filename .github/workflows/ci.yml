name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -v

      - name: Build Python sdist and wheel
        run: python -m build

      - name: Verify bundled assets inside wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel built" }
          python -c "import zipfile; z = zipfile.ZipFile(r'$($wheel.FullName)'); names = z.namelist(); assert any(n.endswith('pocket_agent/assets/pocketbot_sheet.png') for n in names), names; assert any(n.endswith('pocket_agent/assets/pocket_agent.ico') for n in names), names; print('Wheel assets OK')"
